<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="user-info">
            <i class="fas fa-user-circle user-icon"></i>
            <div class="user-info">
                <div class="user-info">
                    <img src="assets/profile/admin.png" alt="Profile" class="profile-pic" />

                    <p class="brand">
                        <span class="amaze">AMAZE</span>
                        <span class="coders">CODERS</span>
                    </p>
                </div>

            </div>

        </div>
        <ul class="menu">
            <li *ngFor="let item of menuItems">
                <a [routerLink]="['/dashboard', item.path]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-item">
                    <i [class]="item.icon"></i>
                    <span>{{ item.label }}</span>
                </a>
            </li>
        </ul>
        <button class="logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
