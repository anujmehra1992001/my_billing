<div class="container mt-4">

    <!-- 🔄 LOADER -->
    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p>Loading dashboard...</p>
    </div>

    <!-- ❌ ERROR -->
    <div *ngIf="error && !loading" class="alert alert-danger">
        {{ error }}
    </div>

    <!-- ✅ DASHBOARD DATA -->
    <div *ngIf="!loading && dashboardData">

        <h4 class="mb-3">Dashboard Summary</h4>

        <div class="row">
            <div class="col-md-3 col-6 mb-3">
                <div class="card p-3 text-center">
                    <h6>Total Users</h6>
                    <h3>{{ dashboardData.cards.totalUsers }}</h3>
                </div>
            </div>

            <div class="col-md-3 col-6 mb-3">
                <div class="card p-3 text-center">
                    <h6>Total Tasks</h6>
                    <h3>{{ dashboardData.cards.totalTasks }}</h3>
                </div>
            </div>

            <div class="col-md-3 col-6 mb-3">
                <div class="card p-3 text-center">
                    <h6>Notifications</h6>
                    <h3>{{ dashboardData.cards.notifications }}</h3>
                </div>
            </div>

            <div class="col-md-3 col-6 mb-3">
                <div class="card p-3 text-center">
                    <h6>Active Products</h6>
                    <h3>{{ dashboardData.cards.activeProducts }}</h3>
                </div>
            </div>
        </div>

    </div>

</div>
