<h2>Profile Settings</h2>

<!-- Loader -->
<div *ngIf="loading">Loading profile...</div>

<!-- Profile -->
<div *ngIf="!loading" class="profile-card">

    <img [src]="profile.avatar || 'assets/profile/'" class="profile-pic" />

    <label>Name</label>
    <input [(ngModel)]="profile.name" />

    <label>Email</label>
    <input [value]="profile.email" disabled />

    <button (click)="updateProfile()">Save</button>

    <p class="success" *ngIf="message">{{ message }}</p>

</div>
