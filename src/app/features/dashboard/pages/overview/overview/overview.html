<div class="container-fluid">


    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
    </div>


    <div *ngIf="!loading">


        <div class="row mb-4">
            <div class="col-lg-3 col-md-6 col-12 mb-3" *ngFor="let card of summaryCards">

                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">{{ card.title }}</h6>
                            <h3 class="mb-0">{{ card.value }}</h3>
                        </div>

                        <i class="fas {{ card.icon }} text-{{ card.color }} fs-2"></i>
                    </div>
                </div>

            </div>
        </div>


        <div class="card">
            <div class="card-header">
                <strong>Recent Activity</strong>
            </div>

            <ul class="list-group list-group-flush">
                <li class="list-group-item" *ngFor="let activity of recentActivities">
                    {{ activity.message }}
                    <span class="float-end text-muted small">
            {{ activity.time }}
          </span>
                </li>
            </ul>
        </div>

    </div>

</div>
