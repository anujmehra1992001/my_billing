<div class="overview-container">

    <!-- 🔹 Loading -->
    <div *ngIf="loading">Loading dashboard...</div>

    <!-- 🔹 SUMMARY CARDS -->
    <div class="cards" *ngIf="!loading">
        <div class="card" *ngFor="let card of summaryCards">
            <h3>{{ card.title }}</h3>
            <p>{{ card.value }}</p>
        </div>
    </div>

    <!-- 🔹 AG GRID TABLE -->
    <h2 style="margin-top: 20px;">Recent Users</h2>

    <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 350px;" [rowData]="rowData" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="5">
    </ag-grid-angular>

    <!-- 🔹 RECENT ACTIVITIES -->
    <h2 style="margin-top: 20px;">Recent Activities</h2>
    <ul>
        <li *ngFor="let activity of recentActivities">
            {{ activity.message }} — <small>{{ activity.time }}</small>

        </li>
    </ul>

</div>
